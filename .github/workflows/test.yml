name: Test plugin runtime

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run market tests
        run: PYTHONPATH=skills/football-tc/scripts python -m unittest discover -s skills/football-tc/tests -p 'test_*.py'
      - name: Compile collector and market scripts
        run: python -m py_compile skills/football-tc/scripts/*.py
      - name: Validate market-only template
        env:
          PYTHONPATH: skills/football-tc/scripts
        run: python skills/football-tc/scripts/run_daily_collection.py --template skills/football-tc/references/collector-market-only.example.json --validate-template
